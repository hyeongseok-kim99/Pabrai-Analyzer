name: Auto score investment universe

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Companies to score in this run"
        required: false
        default: "30"
  schedule:
    - cron: "17 * * * *"

jobs:
  auto-score:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size || '30' }}
      REFRESH_DAYS: "30"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify scoring files
        run: |
          pwd
          test -f scoring_engine.py
          test -f scripts/auto_score.py
          python -m py_compile scoring_engine.py scripts/auto_score.py
      - name: Score next batch
        run: python scripts/auto_score.py
