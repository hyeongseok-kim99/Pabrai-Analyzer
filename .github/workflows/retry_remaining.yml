name: Retry remaining Pabrai scores

on:
  workflow_dispatch:

jobs:
  retry-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BATCH_SIZE: "9999"
      REFRESH_DAYS: "30"
      FORCE_REFRESH: "0"
      RETRY_ONLY: "1"
      SHARD_COUNT: "1"
      SHARD_INDEX: "0"
      REQUEST_DELAY: "2.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify scoring files
        run: |
          test -f scoring_engine.py
          test -f scripts/auto_score.py
          python -m py_compile scoring_engine.py scripts/auto_score.py

      - name: Retry only missing or error companies
        run: python scripts/auto_score.py
